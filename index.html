<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog produse</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Gestiune Produse</h1>
    </header>

    <main>
        <section class="sectiune-formular">
            <h2>Adaugă un produs</h2>
            <form id="formular-produs">
                <div class="grup-input">
                <label for="titlu">Nume produs:</label>
                <input type="text" id="titlu" name="title" required minlength="3" maxlength="20">
                </div>

                <div class="grup-input">
                <label for="pret">Preț:</label>
                <input type="number" id="pret" name="price" min="1" step="0.01" required>
                </div>

                <div class="grup-input">
                <label for="descriere">Descriere:</label>
                <textarea id="descriere" name="description" rows="4" required></textarea>
                </div>

                <button type="submit" id="buton-submit">Adaugă produsul</button>
                <p id="eroare-formular" class="mesaj-eroare ascuns"></p>
            </form>
        </section>
        
        <section class="sectiune-lista">
            <h2>Lista produse</h2>
            
            <p id="stare-incarcare">Se încarcă produsele...</p>
            <p id="stare-eroare" class="mesaj-eroare ascuns">A apărut o eroare la încărcarea produselor.</p>
            <p id="stare-goala" class="ascuns">Nu există produse în listă.</p>

            <ul id="lista-produse"></ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Catalog Produse. Toate drepturile rezervate.</p>
    </footer>
</body>
</html>
